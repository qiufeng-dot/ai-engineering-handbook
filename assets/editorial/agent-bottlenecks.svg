<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120"><rect width="1200" height="1120" fill="#f4f7fa"/><text x="64" y="94" font-size="54" fill="#102239" font-weight="700" font-family="Microsoft YaHei, sans-serif">Agent 设计：先找到瓶颈</text><text x="64" y="151" font-size="32" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">九篇论文，回答四类不同的问题</text><rect x="64" y="198" width="1072" height="172" rx="18" fill="white" stroke="#dce3eb"/><rect x="64" y="198" width="8" height="172" rx="4" fill="#126b70"/><text x="96" y="262" font-size="38" fill="#126b70" font-weight="700" font-family="Microsoft YaHei, sans-serif">01</text><text x="184" y="257" font-size="36" fill="#142337" font-weight="700" font-family="Microsoft YaHei, sans-serif">缺少可靠事实</text><text x="184" y="306" font-size="28" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">查询结果会改变后续动作</text><text x="184" y="345" font-size="27" fill="#126b70" font-weight="600" font-family="Microsoft YaHei, sans-serif">ReAct / STORM</text><rect x="64" y="394" width="1072" height="172" rx="18" fill="white" stroke="#dce3eb"/><rect x="64" y="394" width="8" height="172" rx="4" fill="#315eb0"/><text x="96" y="458" font-size="38" fill="#315eb0" font-weight="700" font-family="Microsoft YaHei, sans-serif">02</text><text x="184" y="453" font-size="36" fill="#142337" font-weight="700" font-family="Microsoft YaHei, sans-serif">解题过程容易遗漏</text><text x="184" y="502" font-size="28" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">先形成步骤或推理结构</text><text x="184" y="541" font-size="27" fill="#315eb0" font-weight="600" font-family="Microsoft YaHei, sans-serif">Plan-and-Solve / Self-Discover</text><rect x="64" y="590" width="1072" height="172" rx="18" fill="white" stroke="#dce3eb"/><rect x="64" y="590" width="8" height="172" rx="4" fill="#7945a3"/><text x="96" y="654" font-size="38" fill="#7945a3" font-weight="700" font-family="Microsoft YaHei, sans-serif">03</text><text x="184" y="649" font-size="36" fill="#142337" font-weight="700" font-family="Microsoft YaHei, sans-serif">重复规划与工具等待</text><text x="184" y="698" font-size="28" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">减少重读，按依赖调度</text><text x="184" y="737" font-size="27" fill="#7945a3" font-weight="600" font-family="Microsoft YaHei, sans-serif">ReWOO / LLMCompiler</text><rect x="64" y="786" width="1072" height="172" rx="18" fill="white" stroke="#dce3eb"/><rect x="64" y="786" width="8" height="172" rx="4" fill="#9b571f"/><text x="96" y="850" font-size="38" fill="#9b571f" font-weight="700" font-family="Microsoft YaHei, sans-serif">04</text><text x="184" y="845" font-size="36" fill="#142337" font-weight="700" font-family="Microsoft YaHei, sans-serif">当前方案还不够好</text><text x="184" y="894" font-size="28" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">修改、记忆反馈、比较路线</text><text x="184" y="933" font-size="27" fill="#9b571f" font-weight="600" font-family="Microsoft YaHei, sans-serif">Self-Refine / Reflexion / LATS</text><text x="64" y="1036" font-size="30" fill="#142337" font-weight="600" font-family="Microsoft YaHei, sans-serif">选择前先问：信息可靠吗？预算够吗？失败能恢复吗？</text><text x="64" y="1081" font-size="25" fill="#536276" font-weight="400" font-family="Microsoft YaHei, sans-serif">阅读整理示意图 · 不是跨论文性能排行榜</text></svg>