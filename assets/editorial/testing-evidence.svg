<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100"><rect width="1200" height="1100" fill="#f5f8f6"/><text x="64" y="94" font-size="49" fill="#15382e" font-weight="700" font-family="Microsoft YaHei,sans-serif">测试通过，要追问哪四件事？</text><text x="64" y="150" font-size="30" fill="#576b63" font-weight="400" font-family="Microsoft YaHei,sans-serif">同一条折扣规则，四类不同的证据</text><rect x="64" y="203" width="1072" height="164" rx="16" fill="white" stroke="#d9e6df"/><rect x="94" y="239" width="110" height="86" rx="12" fill="#e6f3eb"/><text x="113" y="294" font-size="34" fill="#236c48" font-weight="700" font-family="Microsoft YaHei,sans-serif">需求</text><text x="240" y="269" font-size="34" fill="#172b36" font-weight="700" font-family="Microsoft YaHei,sans-serif">规则是不是写完整了？</text><text x="240" y="323" font-size="27" fill="#576b63" font-weight="400" font-family="Microsoft YaHei,sans-serif">满 100 元，且有资格，才打折。</text><rect x="64" y="397" width="1072" height="164" rx="16" fill="white" stroke="#d9e6df"/><rect x="94" y="433" width="110" height="86" rx="12" fill="#e6f3eb"/><text x="113" y="488" font-size="34" fill="#236c48" font-weight="700" font-family="Microsoft YaHei,sans-serif">输入</text><text x="240" y="463" font-size="34" fill="#172b36" font-weight="700" font-family="Microsoft YaHei,sans-serif">选到能暴露错误的数字了吗？</text><text x="240" y="517" font-size="27" fill="#576b63" font-weight="400" font-family="Microsoft YaHei,sans-serif">99.99 / 100.00 / 100.01 元要配上资格条件。</text><rect x="64" y="591" width="1072" height="164" rx="16" fill="white" stroke="#d9e6df"/><rect x="94" y="627" width="110" height="86" rx="12" fill="#e6f3eb"/><text x="113" y="682" font-size="34" fill="#236c48" font-weight="700" font-family="Microsoft YaHei,sans-serif">结构</text><text x="240" y="657" font-size="34" fill="#172b36" font-weight="700" font-family="Microsoft YaHei,sans-serif">每个条件真的改变过结果吗？</text><text x="240" y="711" font-size="27" fill="#576b63" font-weight="400" font-family="Microsoft YaHei,sans-serif">金额、会员、优惠资格，各自找一组成对用例。</text><rect x="64" y="785" width="1072" height="164" rx="16" fill="white" stroke="#d9e6df"/><rect x="94" y="821" width="110" height="86" rx="12" fill="#e6f3eb"/><text x="113" y="876" font-size="34" fill="#236c48" font-weight="700" font-family="Microsoft YaHei,sans-serif">判定</text><text x="240" y="851" font-size="34" fill="#172b36" font-weight="700" font-family="Microsoft YaHei,sans-serif">预期答案是否独立于实现？</text><text x="240" y="905" font-size="27" fill="#576b63" font-weight="400" font-family="Microsoft YaHei,sans-serif">规格要求向下取整，测试不能照抄错误算法。</text><text x="64" y="1049" font-size="28" fill="#236c48" font-weight="600" font-family="Microsoft YaHei,sans-serif">教学示意：覆盖了什么，与判断对了什么，要分别回答。</text></svg>