<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="分支示意：从 main 分出、在分支上提交、合并回 main" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>分支示意：从 main 分出、在分支上提交、合并回 main</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker></defs><rect width="760" height="230" fill="#ffffff"/><line x1="40" y1="70" x2="720" y2="70" stroke="#1f5a8a" stroke-width="4"/><text x="300" y="50" text-anchor="start" font-size="15" font-weight="700" fill="#1f5a8a">main（主线，始终可运行）</text><circle cx="90" cy="70" r="9" fill="#fff" stroke="#1f5a8a" stroke-width="3"/><circle cx="200" cy="70" r="9" fill="#fff" stroke="#1f5a8a" stroke-width="3"/><circle cx="640" cy="70" r="9" fill="#fff" stroke="#1f5a8a" stroke-width="3"/><path d="M200,70 C240,70 240,160 290,160 L560,160 C600,160 600,70 640,70" fill="none" stroke="#2c7a4b" stroke-width="4"/><circle cx="300" cy="160" r="9" fill="#fff" stroke="#2c7a4b" stroke-width="3"/><circle cx="400" cy="160" r="9" fill="#fff" stroke="#2c7a4b" stroke-width="3"/><circle cx="500" cy="160" r="9" fill="#fff" stroke="#2c7a4b" stroke-width="3"/><text x="400" y="200" text-anchor="middle" font-size="14" font-weight="400" fill="#2c7a4b">feature 分支：Codex 在这里提交（每个圆点是一次提交）</text><text x="200" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6b63">从这里分出</text><text x="640" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6b63">审查通过后合并</text></svg>