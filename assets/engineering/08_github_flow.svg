<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="GitHub Flow 六步" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>GitHub Flow 六步</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker></defs><rect width="900" height="290" fill="#ffffff"/><line x1="30" y1="70" x2="870" y2="70" stroke="#1f5a8a" stroke-width="4"/><text x="300" y="48" text-anchor="start" font-size="15" font-weight="700" fill="#1f5a8a">main：永远可以发布</text><path d="M120,70 C160,70 160,170 210,170 L700,170 C740,170 740,70 780,70" fill="none" stroke="#2c7a4b" stroke-width="4"/><circle cx="120" cy="70" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="120" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">① 建分支</text><circle cx="260" cy="170" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="260" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">② 修改·提交·推送</text><circle cx="420" cy="170" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="420" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">③ 开 PR</text><circle cx="560" cy="170" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="560" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">④ 审查·CI·再修改</text><circle cx="780" cy="70" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="780" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">⑤ 合并</text><circle cx="850" cy="70" r="10" fill="#fff" stroke="#202b29" stroke-width="2.5"/><text x="850" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#202b29">⑥ 删分支</text><rect x="370" y="222" 